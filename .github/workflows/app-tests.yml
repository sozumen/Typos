# Runs chosen in-app tests (Mocha, inside a built copy of the application on Linux) and puts the
# end of the output into the run's annotations, so a failure can be read without the full log.
# Defaults to the tests for the features Typos added. Run it by hand from the Actions tab.
name: App tests

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Arguments for test/runtests.sh (test names, or "-p 2/4" for a shard of the whole suite)'
        required: true
        default: '-f classicItemType itemRelations classicalAbbreviations jurismImport backup server cleanup'
      lines:
        description: 'How many lines from the end of the output to put in the annotation'
        required: false
        default: '120'
      regenerate:
        description: 'Also rewrite the generated sample data (itemJSON, translatorExport*) and push it to the branch "sample-data" (use with args "sampleDataGenerator")'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install xvfb
        run: sudo apt update && sudo apt install -y xvfb

      - name: Cache xulrunner
        id: xulrunner-cache
        uses: actions/cache@v4
        with:
          path: app/xulrunner/firefox-x86_64
          key: xulrunner-${{ hashFiles('app/config.sh', 'app/scripts/fetch_xulrunner') }}

      - name: Fetch xulrunner
        if: steps.xulrunner-cache.outputs.cache-hit != 'true'
        run: app/scripts/fetch_xulrunner -p l

      - name: Fetch the updater binary (kept in upstream's LFS store)
        run: app/scripts/fetch_lfs_upstream app/linux/updater.tar.xz

      - name: Install Node modules
        run: |
          for attempt in 1 2 3; do
            npm install --fetch-retries=5 --fetch-retry-mintimeout=20000 && exit 0
            sleep 15
          done
          exit 1

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Run the tests
        env:
          CI_RUN_LINES: ${{ inputs.lines }}
          TYPOS_SAMPLE_DATA_DIR: ${{ inputs.regenerate && format('{0}/test/tests/data', github.workspace) || '' }}
        run: .github/scripts/ci-run 'In-app tests' xvfb-run test/runtests.sh ${{ inputs.args }}

      - name: Push regenerated sample data
        if: ${{ inputs.regenerate }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add test/tests/data
          git diff --cached --stat
          git commit -m "Regenerate sample data" || { echo "Nothing changed"; exit 0; }
          git push --force origin HEAD:refs/heads/sample-data

# Runs chosen in-app tests (Mocha, inside a built copy of the application on Linux) and puts the
# end of the output into the run's annotations, so a failure can be read without the full log.
# Defaults to the tests for the features Typos added. Run it by hand from the Actions tab.
name: App tests

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'Arguments for test/runtests.sh (test names, or "-p 2/4" for a shard of the whole suite)'
        required: true
        default: '-f classicItemType itemRelations classicalAbbreviations jurismImport backup server'
      lines:
        description: 'How many lines from the end of the output to put in the annotation'
        required: false
        default: '120'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install xvfb
        run: sudo apt update && sudo apt install -y xvfb

      - name: Cache xulrunner
        id: xulrunner-cache
        uses: actions/cache@v4
        with:
          path: app/xulrunner/firefox-x86_64
          key: xulrunner-${{ hashFiles('app/config.sh', 'app/scripts/fetch_xulrunner') }}

      - name: Fetch xulrunner
        if: steps.xulrunner-cache.outputs.cache-hit != 'true'
        run: app/scripts/fetch_xulrunner -p l

      - name: Install Node modules
        run: |
          for attempt in 1 2 3; do
            npm install --fetch-retries=5 --fetch-retry-mintimeout=20000 && exit 0
            sleep 15
          done
          exit 1

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Run the tests
        env:
          CI_RUN_LINES: ${{ inputs.lines }}
        run: .github/scripts/ci-run 'In-app tests' xvfb-run test/runtests.sh ${{ inputs.args }}

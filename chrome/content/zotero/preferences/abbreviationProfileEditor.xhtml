<?xml version="1.0"?>
<!--
    Editor for an abbreviation profile: which lists to use, in what order, which kinds of
    entry to apply, and how the result is shown. Opened modally from the Cite preferences with
    an object in window.arguments[0]:
      in:  { profile: Object|null, lists: [{ id, name, builtin, active }] }
      out: { ok: Boolean, result: { name, mode, scope, types, preferItemAbbreviations, active } }

    This file is part of the Zotero-derived application and is licensed under the
    GNU Affero General Public License, version 3 or later.
-->

<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/preferences.css"?>

<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	data-l10n-id="preferences-abbreviations-profile-editor-window"
	onload="Zotero_AbbreviationProfileEditor.onLoad()">
<dialog
	buttons="cancel,accept"
	id="zotero-abbreviationProfileEditor">

	<script src="chrome://zotero/content/include.js"/>

	<linkset>
		<html:link rel="localization" href="branding/brand.ftl"/>
		<html:link rel="localization" href="preferences.ftl"/>
	</linkset>

	<vbox id="abbreviation-profile-editor" style="min-width: 28em">
		<label control="abbreviation-profile-name" data-l10n-id="preferences-abbreviations-profile-name"/>
		<html:input type="text" id="abbreviation-profile-name" oninput="Zotero_AbbreviationProfileEditor.updateAccept()"/>

		<separator class="thin"/>

		<hbox align="center">
			<label control="abbreviation-profile-mode" data-l10n-id="preferences-classical-abbreviations-mode"/>
			<menulist id="abbreviation-profile-mode">
				<menupopup>
					<menuitem value="abbreviated" data-l10n-id="preferences-classical-abbreviations-mode-abbreviated"/>
					<menuitem value="short-title" data-l10n-id="preferences-classical-abbreviations-mode-short-title"/>
					<menuitem value="off" data-l10n-id="preferences-classical-abbreviations-mode-off"/>
				</menupopup>
			</menulist>
		</hbox>
		<hbox align="center">
			<label control="abbreviation-profile-scope" data-l10n-id="preferences-classical-abbreviations-scope"/>
			<menulist id="abbreviation-profile-scope">
				<menupopup>
					<menuitem value="classic" data-l10n-id="preferences-classical-abbreviations-scope-classic"/>
					<menuitem value="all" data-l10n-id="preferences-classical-abbreviations-scope-all"/>
				</menupopup>
			</menulist>
		</hbox>

		<separator class="thin"/>

		<label data-l10n-id="preferences-abbreviations-types"/>
		<vbox id="abbreviation-profile-types">
			<html:label><html:input type="checkbox" data-type="work"/> <html:span data-l10n-id="preferences-abbreviations-type-work"/></html:label>
			<html:label><html:input type="checkbox" data-type="author"/> <html:span data-l10n-id="preferences-abbreviations-type-author"/></html:label>
			<html:label><html:input type="checkbox" data-type="journal"/> <html:span data-l10n-id="preferences-abbreviations-type-journal"/></html:label>
			<html:label><html:input type="checkbox" data-type="series"/> <html:span data-l10n-id="preferences-abbreviations-type-series"/></html:label>
			<html:label><html:input type="checkbox" data-type="publisher"/> <html:span data-l10n-id="preferences-abbreviations-type-publisher"/></html:label>
			<html:label><html:input type="checkbox" data-type="place"/> <html:span data-l10n-id="preferences-abbreviations-type-place"/></html:label>
		</vbox>
		<html:label>
			<html:input type="checkbox" id="abbreviation-profile-prefer-item"/>
			<html:span data-l10n-id="preferences-abbreviations-prefer-item-text"/>
		</html:label>

		<separator class="thin"/>

		<label data-l10n-id="preferences-abbreviations-profile-lists"/>
		<description data-l10n-id="preferences-abbreviations-profile-lists-description"/>
		<html:div id="abbreviation-profile-lists"/>
	</vbox>

	<script>
	<![CDATA[
		document.addEventListener('dialogaccept', () => Zotero_AbbreviationProfileEditor.onAccept());

		var Zotero_AbbreviationProfileEditor = new function () {
			var io = window.arguments[0];
			var order = []; // [{ id, name, builtin, checked }]

			this.onLoad = function () {
				var profile = io.profile || {
					name: '',
					mode: 'abbreviated',
					scope: 'classic',
					types: ['work', 'author', 'journal', 'series'],
					preferItemAbbreviations: true,
					active: []
				};
				document.getElementById('abbreviation-profile-name').value = profile.name;
				document.getElementById('abbreviation-profile-mode').value = profile.mode;
				document.getElementById('abbreviation-profile-scope').value = profile.scope;
				document.getElementById('abbreviation-profile-prefer-item').checked
					= profile.preferItemAbbreviations !== false;
				for (let box of document.querySelectorAll('#abbreviation-profile-types input')) {
					box.checked = profile.types.includes(box.dataset.type);
				}

				// Lists in the profile's own order first, then the rest
				var byID = new Map(io.lists.map(list => [list.id, list]));
				var chosen = profile.active.filter(id => byID.has(id));
				order = chosen.map(id => ({ ...byID.get(id), checked: true }));
				for (let list of io.lists) {
					if (!chosen.includes(list.id)) order.push({ ...list, checked: false });
				}
				this.renderLists();
				this.updateAccept();
				window.sizeToContent();
			};

			this.renderLists = function () {
				var container = document.getElementById('abbreviation-profile-lists');
				container.replaceChildren();
				order.forEach((entry, i) => {
					var row = document.createElement('div');
					var label = document.createElement('label');
					var box = document.createElement('input');
					box.type = 'checkbox';
					box.checked = entry.checked;
					box.addEventListener('change', () => { entry.checked = box.checked; });
					label.append(box, ' ' + entry.name);
					row.append(label);

					var up = document.createElement('button');
					up.textContent = '▲';
					up.disabled = i === 0;
					up.addEventListener('click', () => this.move(i, -1));
					var down = document.createElement('button');
					down.textContent = '▼';
					down.disabled = i === order.length - 1;
					down.addEventListener('click', () => this.move(i, 1));
					row.append(up, down);
					container.append(row);
				});
			};

			this.move = function (i, delta) {
				var j = i + delta;
				if (j < 0 || j >= order.length) return;
				[order[i], order[j]] = [order[j], order[i]];
				this.renderLists();
			};

			this.updateAccept = function () {
				document.getElementById('zotero-abbreviationProfileEditor').getButton('accept').disabled
					= document.getElementById('abbreviation-profile-name').value.trim() === '';
			};

			this.onAccept = function () {
				io.result = {
					name: document.getElementById('abbreviation-profile-name').value.trim(),
					mode: document.getElementById('abbreviation-profile-mode').value,
					scope: document.getElementById('abbreviation-profile-scope').value,
					types: Array.from(document.querySelectorAll('#abbreviation-profile-types input'))
						.filter(box => box.checked)
						.map(box => box.dataset.type),
					preferItemAbbreviations: document.getElementById('abbreviation-profile-prefer-item').checked,
					active: order.filter(entry => entry.checked).map(entry => entry.id)
				};
				io.ok = true;
			};
		};
	]]>
	</script>
</dialog>
</window>
